<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой 3D-тур Pannellum</title>
    <link rel="stylesheet" href="css/pannellum.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #panorama-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="panorama-container"></div>

    <script src="js/libpannellum.js"></script>
    <script src="js/pannellum.js"></script>

    <script>
        // Динамически загружаем файл конфигурации тура
        fetch('tour.json')
            .then(response => response.json())
            .then(config => {
                // Инициализируем плеер с загруженными данными
                pannellum.viewer('panorama-container', config);
            })
            .catch(error => {
                console.error('Ошибка загрузки конфигурации тура:', error);
                alert('Не удалось загрузить tour.json. Убедитесь, что запускаете тур через локальный сервер (Live Server)!');
            });
    </script>

</body>
</html>
