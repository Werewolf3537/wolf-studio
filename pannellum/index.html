<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Виртуальный Тур</title>
    <link rel="stylesheet" href="css/pannellum.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Жесткое скрытие названия панорамы в левом нижнем углу */
        .pnm-ui .pnm-title-box, 
        #panorama-container .pnm-title-box,
        .pnm-title-box {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Полное уничтожение компаса на смартфонах */
        .pnm-ui .pnm-compass,
        #panorama-container .pnm-compass,
        .pnm-compass {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <!-- Название проекта сверху экрана -->
    <div class="tour-header" id="project-title">Загрузка проекта...</div>

    <!-- Кнопка и меню списка проектов -->
    <button class="menu-toggle-btn" onclick="toggleMenu()">☰ Проекты</button>
    <div class="projects-menu" id="projectsMenu">
        <h3>Мои проекты</h3>
        <ul class="projects-list">
            <li><a href="?project=flat1">ЖК "Комфорт" - Кв. 45</a></li>
            <li><a href="?project=flat2">ЖК "Премиум" - Офис</a></li>
            <li><a href="?project=cottage">Загородный дом</a></li>
        </ul>
    </div>

    <!-- Кастомная кнопка Гироскопа -->
    <button class="gyro-toggle-btn" id="gyroBtn" onclick="toggleGyro()">📱 Гироскоп: Выкл</button>

    <!-- Кнопка и контейнер мини-карты -->
    <button class="map-toggle-btn" onclick="toggleMap()">🗺️ Карта</button>
    <div class="minimap-container" id="miniMap">
        <!-- Картинка автоматически сгенерируется внутри скрипта minimap.js -->
    </div>

    <!-- Область 3D-тура -->
    <div id="panorama-container"></div>

    <!-- Подключение библиотек Pannellum -->
    <script src="js/libpannellum.js"></script>
    <script src="js/pannellum.js"></script>

    <!-- Подключаем наш изолированный файл мини-карты (ОБЯЗАТЕЛЬНО ПЕРЕД НАШИМ СКРИПТОМ ИНИЦИАЛИЗАЦИИ) -->
    <script src="minimap.js"></script>

    <script>
        let viewer = null;
        let isGyroActive = false;

        // 1. Динамическое чтение конфигурации тура
        fetch('tour.json')
            .then(response => response.json())
            .then(config => {
                // Инициализируем плеер и сохраняем ссылку в глобальную переменную viewer
                viewer = pannellum.viewer('panorama-container', config);
                document.getElementById('project-title').innerText = config.projectTitle || "Мой 3D Тур";

                // ЧИНИМ КАРТУ: Запускаем мини-карту строго ПОСЛЕ того, как плеер успешно создался из JSON!
                if (typeof initMinimap === 'function') {
                    initMinimap(viewer);
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки конфигурации:', error);
                alert('Не удалось загрузить tour.json');
            });

        // 2. Логика управления Гироскопом
        function toggleGyro() {
            if (!viewer) return;

            const btn = document.getElementById('gyroBtn');
            isGyroActive = !isGyroActive;

            if (isGyroActive) {
                viewer.startOrientation();
                btn.innerText = "📱 Гироскоп: Вкл";
                btn.classList.add('active');

                viewer.setMouseZoom(false); 
                viewer.getConfig().draggable = false;
                
                window.gyroInterval = setInterval(() => {
                    if(viewer && isGyroActive) viewer.startOrientation();
                }, 100);

            } else {
                viewer.stopOrientation();
                btn.innerText = "📱 Гироскоп: Выкл";
                btn.classList.remove('active');

                viewer.setMouseZoom(true);
                viewer.getConfig().draggable = true;
                
                clearInterval(window.gyroInterval);
            }
        }

        // 3.1. Логика интерактивного интерфейса (Открыть/Закрыть)
        function toggleMenu() {
            document.getElementById('projectsMenu').classList.toggle('active');
        }

        function toggleMap() {
            document.getElementById('miniMap').classList.toggle('active');
        }

        // 3.2. Закрытие меню при начале вращения панорамы
        const closeMenu = () => {
            document.getElementById('projectsMenu').classList.remove('active');
        };

        document.getElementById('panorama-container').addEventListener('click', closeMenu);
        document.getElementById('panorama-container').addEventListener('touchstart', closeMenu);
    </script>

</body>
</html>
